name: Weekly forecast retraining
on:
  schedule:
    - cron: "23 2 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train time-ordered models
        run: python -m ml.train
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Publish models that beat persistence
        run: python -m ml.publish
        env:
          SAANS_API_URL: ${{ secrets.SAANS_API_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
