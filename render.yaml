services:
  - type: web
    name: saans
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAQ_API_KEY
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      - key: INGEST_TOKEN
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@example.com
      - key: ALLOWED_ORIGIN
        value: https://saans.onrender.com
